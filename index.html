<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff;font-family:system-ui,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
/* One image per avatar, including under transparent focus borders. */
.avc,#editAv,.crow .ca,#wav{background-repeat:no-repeat;background-origin:border-box;background-clip:border-box}

/* top bar */
#topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 22px 0}
#topbar .spacer{flex:1}
#miniTitle{position:absolute;left:60px;right:60px;top:env(safe-area-inset-top,0px);height:64px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#topbar{background:transparent;transition:background .2s}
#topbar.scrolled{background:rgba(12,12,14,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#topbar.scrolled #miniTitle{opacity:1}
#manageBtn{color:#e8e8ea;font-size:17px;padding:8px 4px}
#manageBtn:active{opacity:.6}

/* picker */
#scrPick h1{text-align:center;font-size:27px;font-weight:700;margin:8px 0 44px;letter-spacing:.2px}
#grid{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 22px;max-width:720px;margin:0 auto;padding:0 28px calc(60px + env(safe-area-inset-bottom,0px))}
.p{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;text-align:center;width:142px}
.p .av{width:100%;max-width:142px;aspect-ratio:1;position:relative;border-radius:50%;border:3px solid transparent;transition:transform .15s,border-color .15s}
.avc{width:100%;height:100%;border-radius:50%;overflow:hidden;background-size:cover;background-position:center}
.p:active .av{transform:scale(1.06)}
@media(hover:hover){.p:hover .av{border-color:#fff;transform:scale(1.06)}}
.p .nm{font-size:17px;font-weight:500}
.p .lockic{width:17px;height:17px;opacity:.85;margin-top:-8px}
.av svg{display:block;width:100%;height:100%}
.p.add .av{border:2px solid #3a3a40;background:#1f1f23}
.p.add .av .plus{width:46%;height:46%}
body.editmode .p .badge{position:absolute;bottom:-2%;inset-inline-end:-2%;width:30%;aspect-ratio:1;max-width:44px;background:#f5f5f7;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0009}
.p .badge{display:none}
.badge svg{width:52%;height:52%}

/* sub screens */
.subhead{display:flex;align-items:center;height:60px;padding:0 14px;position:relative}
.subhead h2{position:absolute;left:0;right:0;text-align:center;font-size:19px;font-weight:600;margin:0;pointer-events:none}
.subhead .iconbtn{padding:8px;display:flex}
.subhead .iconbtn svg{width:26px;height:26px}
.subhead .txtbtn{margin-inline-start:auto;color:#e8e8ea;font-size:16px;padding:8px 4px}

/* edit profile */
#editBody{max-width:460px;margin:0 auto;padding:18px 24px calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
#editAvWrap{align-self:center;position:relative;margin:6px 0 22px}
#editAv{width:120px;height:120px;border-radius:50%;overflow:hidden;background-size:cover;background-position:center;position:relative}
#editAvBtn{position:absolute;bottom:0;inset-inline-end:0;width:36px;height:36px;background:#f5f5f7;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0009}
#editAvBtn svg{width:54%;height:54%}
#nameInput{background:#2b2b30;border:0;border-radius:8px;color:#fff;font-size:18px;padding:14px 16px;width:100%;outline:none;text-align:center}
#nameInput:focus{background:#34343a}
.rows{margin-top:28px;border-top:1px solid #242428}
.rrow{display:flex;align-items:center;width:100%;padding:17px 4px;border-bottom:1px solid #242428;font-size:17px;text-align:start;color:#e8e8ea;gap:10px}
.rrow .sub{color:#8e8e93;font-size:14px}
.rrow.danger{color:#ff594f;justify-content:center}
.rrow .chev{margin-inline-start:auto;color:#636366;display:flex}
.rrow .chev svg{width:16px;height:16px}
.switch{margin-inline-start:auto;width:52px;height:32px;border-radius:16px;background:#39393d;position:relative;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:#1db5d8}
.switch.on::after{transform:translateX(-20px)}

/* avatar picker */
#avCats{padding:6px 0 calc(60px + env(safe-area-inset-bottom,0px))}
.cat{margin-bottom:30px}
.cat h3{font-size:20px;font-weight:600;margin:0 22px 16px;color:#f2f2f4}
.crow{display:flex;gap:16px;overflow-x:auto;padding:4px 22px;scrollbar-width:none}
.crow::-webkit-scrollbar{display:none}
.crow .ca{flex:0 0 auto;width:96px;height:96px;border-radius:50%;overflow:hidden;border:3px solid transparent;transition:transform .15s,border-color .15s;background-size:cover;background-position:center;padding:0}
.crow .ca:active{transform:scale(1.08)}
@media(hover:hover){.crow .ca:hover{border-color:#fff;transform:scale(1.08)}}

/* welcome */
#scrWelcome{min-height:calc(100vh - 64px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#wav{width:170px;height:170px;border-radius:50%;overflow:hidden;background-size:cover;background-position:center}
#wname{font-size:32px;margin:0}
#backBtn{color:#9c9ca1;font-size:17px;padding:10px 22px;border:1px solid #4a4a4e;border-radius:6px}

/* pin overlay */
#pin{position:fixed;inset:0;z-index:50;background:#0b0b0df2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#pinTitle{font-size:20px;font-weight:600;margin:0}
#pinSub{color:#8e8e93;font-size:14px;margin-top:-16px;min-height:18px}
#dots{display:flex;gap:16px;direction:ltr}
#dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #8e8e93}
#dots i.f{background:#fff;border-color:#fff}
#pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px;direction:ltr}
#pad button{width:74px;height:74px;border-radius:50%;background:#1c1c1e;font-size:27px;color:#fff}
#pad button:active{background:#2c2c2e}
#pinCancel{color:#9c9ca1;font-size:16px;padding:6px 16px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.shake{animation:shake .4s}
/* gallery source gear + menu */
#gearBtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));z-index:30;width:44px;height:44px;border-radius:50%;background:#1c1c1ecc;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0008}
#gearBtn svg{width:22px;height:22px;stroke:#c9c9cd;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#gearBtn:active{transform:scale(.92)}
#gearMenu{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));z-index:31;background:#1f1f23;border:1px solid #34343a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:210px;box-shadow:0 8px 24px #000a}
#gearMenu button{padding:14px 18px;font-size:16px;text-align:start;color:#e8e8ea;display:flex;align-items:center;justify-content:space-between;gap:12px}
#gearMenu button:active{background:#2c2c32}
#gearMenu button+button{border-top:1px solid #2c2c32}
#gearMenu button .chk{color:#1db5d8;font-weight:700;visibility:hidden}
#gearMenu button.on .chk{visibility:visible}
#credits{position:fixed;inset:0;z-index:60;background:#0b0b0df2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
#creditsBox{background:#1c1c1f;border-radius:14px;max-width:520px;width:100%;max-height:70vh;overflow-y:auto;padding:18px 20px}
#creditsBox h3{margin:0 0 12px;font-size:18px}
.crit{font-size:13px;color:#b9b9be;margin-bottom:10px;line-height:1.4}
.crit a{color:#4aa8ff;text-decoration:none;word-break:break-all}
.cvc{margin:0 22px;font-size:13px;color:#8e8e93}.cvc a{color:#4aa8ff;text-decoration:none}
#cvCredit{background:linear-gradient(transparent,#0a0a0b 60%);padding:18px 22px calc(14px + env(safe-area-inset-bottom,0px)) 72px;bottom:0!important;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:#636366;z-index:6;pointer-events:none;margin:0}
.hh{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-repeat:no-repeat;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#cvCredit a{color:#4aa8ff;pointer-events:auto}
#creditsClose{padding:10px 26px;border:1px solid #4a4a4e;border-radius:8px;color:#e8e8ea}
[dir="ltr"] .switch.on::after{transform:translateX(20px)}
[dir="ltr"] .subhead .iconbtn svg{transform:scaleX(-1)}
[dir="ltr"] .rrow .chev svg{transform:scaleX(-1)}
</style>

</head>
<body>

<header id="topbar"><button id="manageBtn">עריכת פרופילים</button><span class="spacer"></span><span id="miniTitle"></span></header>

<main>

</section>

<section id="scrEdit" hidden>

    <h2 id="editTitle">עריכת פרופיל</h2>

      <button class="rrow" id="removePhoto" hidden>הסרת התמונה וחזרה לדמות</button>
      <div class="rrow" id="lockRow">נעילה בקוד<span class="sub" id="lockState"></span><button class="switch" id="lockSwitch" aria-label="נעילה בקוד"></button></div>
      <button class="rrow danger" id="delProfile">מחיקת פרופיל</button>
    </div>
  </div>
</section>

<section id="scrAvatars" hidden>
  <div class="subhead">
    <button class="iconbtn" id="avBack" aria-label="חזרה"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <h2 id="avTitle">בחירת דמות</h2>
    <button class="txtbtn" id="avSkip">דילוג</button>
  </div>
  <div id="avCats"></div>
</section>

<section id="scrWelcome" hidden>
  <div id="wav"></div>
  <h1 id="wname"></h1>
  <button id="backBtn">החלפת פרופיל</button>
</section>
</main>
<div id="cvCredit" class="cvc" hidden></div>

<div id="gearMenu" hidden>
  <button id="gmBuiltin">דמויות האתר<span class="chk">✓</span></button>
  <button id="gmWeb">תמונות מהאינטרנט<span class="chk">✓</span></button>
  <button id="gmLang">English</button>
  <button id="gmCredits">קרדיטים לתמונות</button>
</div>
<div id="credits" hidden><div id="creditsBox"><h3>קרדיטים לתמונות</h3><div id="creditsList"></div></div><button id="creditsClose">סגירה</button></div>

<div id="pin" hidden>
  <p id="pinTitle"></p>
  <p id="pinSub"></p>
  <div id="dots"><i></i><i></i><i></i><i></i></div>
  <div id="pad"></div>

</div>

<input type="file" id="file" accept="image/*" hidden>

/* Sync hooks. KPprePs = deep snapshot of THIS device's local profiles, taken
 * when cloud state first takes over. On sign-out/revoke (state==null) the app
 * MUST stop rendering cloud data: restore the snapshot (or base localStorage,
 * or empty), never keep the last cloud state on screen. */
window.KPprePs=null;
window.KPheldState=null;window.KPconflictResolved=false;
window.KPonRemote=function(state){
if(!state){
window.KPheldState=null;window.KPconflictResolved=false;
if(window.KPprePs){ps=window.KPprePs;window.KPprePs=null}
else{try{ps=JSON.parse(localStorage.getItem("kidsProfiles.v2")||"null")||[]}catch(e){ps=[]}}
render();return}
/* First-sync conflict: NEVER let cloud data replace the visible picker before
 * the owner explicitly chooses (merge / keep cloud / replace cloud). Hold the
 * local view and surface the blocking chooser instead. */
if(window.KPsync&&window.KPsync.signedIn&&!window.KPconflictResolved){
if(!state.complete)return; // cloud not fully loaded yet: keep local view
if(window.KPsync.hasLocalBackup&&window.KPsync.hasLocalBackup()){
window.KPheldState=state;
if(window.KPshowConflict)window.KPshowConflict();
return}}
if(!window.KPprePs){try{window.KPprePs=JSON.parse(JSON.stringify(ps))}catch(e){window.KPprePs=[]}}
